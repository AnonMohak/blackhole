<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Event Horizon</title>
    <meta name="description" content="Five real-time black hole scenes in three.js." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2215%22 fill=%22%23f4ead8%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%229%22 fill=%22%23000%22/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <img id="ref" alt="" hidden />
    <div id="fade"></div>
    <div class="hud" aria-hidden="false">
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      <header class="hud-head">
        <p class="eyebrow">Event Horizon</p>
        <h1 id="hud-title" data-num="I">Astronaut</h1>
        <p id="hud-caption"></p>
      </header>
      <div class="hud-tools">
        <button type="button" id="btn-cine" title="Cinematic camera (C)" aria-label="Cinematic camera" aria-pressed="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="1.5"/><path d="M16 10l5-3v10l-5-3z"/></svg>
        </button>
        <button type="button" id="btn-full" title="Fullscreen (F)" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <button type="button" id="btn-hide" title="Hide interface (H)" aria-label="Hide interface">
          <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="hud-ruler"><div id="hud-ticks" class="ticks"></div><div id="hud-mark" class="mark"><span id="hud-mark-val">0 m</span></div></div>
      <div id="hud-tele" class="hud-tele"></div>
    </div>
    <nav class="selector" aria-label="Scene"></nav>
    <p class="keys">1–5 scene &nbsp;·&nbsp; C camera &nbsp;·&nbsp; H hide &nbsp;·&nbsp; G tune</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
